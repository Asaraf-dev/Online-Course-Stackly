<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | E-Learning & Online Course Platform</title>
    <meta name="description"
        content="The page you are looking for could not be found. Return to Stackly and continue your learning journey.">
    <!--- Bootstrap CSS --->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <!--- Bootstrap Icons --->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--- Global CSS --->
    <link rel="stylesheet" href="assets/css/global.css">
    <!--- 404 CSS --->
    <link rel="stylesheet" href="assets/css/404.css">
</head>

<body>

    <!--- 404 Hero --->
    <main class="ec-404">
        <div class="ec-404-background">
            <span class="ec-404-grid"></span>
            <span class="ec-404-orb ec-404-orb-one"></span>
            <span class="ec-404-orb ec-404-orb-two"></span>
            <span class="ec-404-orb ec-404-orb-three"></span>
        </div>

        <div class="container">
            <div class="ec-404-content">

                <div class="ec-404-visual">
                    <div class="ec-404-number ec-404-number-left">4</div>

                    <div class="ec-404-center">
                        <div class="ec-404-center-ring ec-404-center-ring-one"></div>
                        <div class="ec-404-center-ring ec-404-center-ring-two"></div>

                        <div class="ec-404-center-icon">
                            <i class="bi bi-compass"></i>
                        </div>
                    </div>

                    <div class="ec-404-number ec-404-number-right">4</div>
                </div>

                <div class="ec-404-label">
                    <span class="ec-404-label-line"></span>
                    <span>ERROR 404</span>
                    <span class="ec-404-label-line"></span>
                </div>

                <h1 class="ec-404-title">
                    Looks like you've
                    <span>lost your way.</span>
                </h1>

                <p class="ec-404-description">
                    The page you're looking for doesn't exist, has moved,
                    or may have taken a little detour. Don't worry —
                    your learning journey is still on track.
                </p>

                <div class="ec-404-actions">
                    <button type="button" class="ec-404-back-btn" id="ec-404-back">
                        <span class="ec-404-btn-icon">
                            <i class="bi bi-arrow-left"></i>
                        </span>
                        <span>Go Back</span>
                    </button>

                    <a href="index.html" class="ec-404-home-btn">
                        <span>Go Home</span>
                        <span class="ec-404-home-icon">
                            <i class="bi bi-arrow-up-right"></i>
                        </span>
                    </a>
                </div>

                <div class="ec-404-hint">
                    <i class="bi bi-lightbulb"></i>
                    <span>There's always another lesson waiting.</span>
                </div>
            </div>
        </div>

        <div class="ec-404-bottom-number">404</div>
    </main>
    <!--- End 404 Hero --->

    <!--- Bootstrap JS --->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!--- 404 JS --->
    <script src="assets/js/404.js"></script>

</body>

</html>
